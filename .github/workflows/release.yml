name: Release

# Pushing a version tag (v1.2.3) lints the code, builds the production ZIP
# with the same script used locally (bin/build-zip.ps1), regenerates the
# translation template and attaches both to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli

      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './_build/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check smart-domain-mapping-system/admin/js/admin.js

      - name: Build production ZIP
        shell: pwsh
        run: ./bin/build-zip.ps1

      - name: Generate translation template (.pot)
        run: |
          mkdir -p smart-domain-mapping-system/languages
          wp i18n make-pot smart-domain-mapping-system smart-domain-mapping-system/languages/domain-mapping-system.pot \
            --domain=domain-mapping-system \
            --package-name="Smart Domain Mapping System"

      - name: Create GitHub Release with ZIP and POT attached
        uses: softprops/action-gh-release@v3
        with:
          files: |
            smart-domain-mapping-system-*.zip
            smart-domain-mapping-system/languages/*.pot
          generate_release_notes: true
