name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript + Actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # CodeQL has no PHP extractor, so scan the language surfaces it does
          # support here: the admin JavaScript and the GitHub Actions workflows.
          # PHP is covered by PHP_CodeSniffer + PHPCompatibility in ci.yml.
          languages: javascript-typescript,actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
