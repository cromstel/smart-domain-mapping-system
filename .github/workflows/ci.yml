name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check smart-domain-mapping-system/admin/js/admin.js

  # Full PHPUnit runs require the WordPress test suite
  # (WP_TESTS_DIR + WP_MULTISITE=1, see tests/bootstrap.php) and are run in
  # an environment with the test library installed:
  #   WP_TESTS_DIR=/path/to/wordpress-develop/tests/phpunit vendor/bin/phpunit -c phpunit.xml.dist
